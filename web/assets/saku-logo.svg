<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background hitam rounded -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="#000000"/>

  <!-- Dompet hijau lime -->
  <g transform="translate(100, 280)">
    <!-- Body dompet -->
    <rect x="0" y="60" width="320" height="240" rx="24" ry="24" fill="#a8e000"/>
    <!-- Tutup dompet (flap atas) -->
    <rect x="0" y="20" width="320" height="90" rx="18" ry="18" fill="#c8f135"/>
    <!-- Lekukan tutup -->
    <rect x="0" y="70" width="320" height="40" fill="#c8f135"/>
    <!-- Garis buku/akordion kiri -->
    <rect x="18" y="24" width="14" height="80" rx="7" fill="#8abf00"/>
    <rect x="38" y="24" width="8" height="80" rx="4" fill="#7aaf00"/>
    <!-- Slot koin/card di dompet -->
    <rect x="200" y="130" width="100" height="60" rx="14" fill="#8abf00"/>
    <!-- Highlight dompet -->
    <rect x="20" y="75" width="260" height="18" rx="9" fill="rgba(255,255,255,0.18)"/>
  </g>

  <!-- Koin emas (stack 3 koin) -->
  <g transform="translate(330, 460)">
    <!-- Koin bawah -->
    <ellipse cx="100" cy="130" rx="100" ry="28" fill="#b8860b"/>
    <rect x="0" y="100" width="200" height="30" fill="#daa520"/>
    <ellipse cx="100" cy="100" rx="100" ry="28" fill="#ffd700"/>
    <!-- Koin tengah -->
    <ellipse cx="100" cy="72" rx="100" ry="28" fill="#b8860b"/>
    <rect x="0" y="42" width="200" height="30" fill="#daa520"/>
    <ellipse cx="100" cy="42" rx="100" ry="28" fill="#ffd700"/>
    <!-- Koin atas -->
    <ellipse cx="100" cy="14" rx="100" ry="28" fill="#b8860b"/>
    <rect x="0" y="-16" width="200" height="30" fill="#daa520"/>
    <ellipse cx="100" cy="-16" rx="100" ry="28" fill="#ffd700"/>
    <!-- Highlight koin atas -->
    <ellipse cx="100" cy="-16" rx="70" ry="18" fill="rgba(255,255,255,0.22)"/>
    <!-- Simbol $ di koin atas -->
    <text x="100" y="-8" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#b8860b">$</text>
  </g>

  <!-- Teks SAKU -->
  <text x="560" y="530" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="260" font-weight="900" fill="#ffffff" letter-spacing="-4">SAKU</text>

  <!-- Tagline -->
  <text x="512" y="720" text-anchor="middle" font-family="Arial, Helvetica Neue, sans-serif" font-size="62" font-weight="600" fill="#c8f135" letter-spacing="1">Sistem Atur Keuangan</text>
</svg>
